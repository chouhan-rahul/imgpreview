name: Greetings

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]
    branches:
      - main
      - develop

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}

          # Welcome message for first-time Issue creators
          issue_message: |
            ## Welcome to the Img Preview community! 👋🎉

            Thank you for opening your first issue. We are excited to have you here!

            **Before we proceed, please ensure:**
            - 🔄 The issue is reproducible
            - 📦 You are using the latest extension version
            - 📜 Relevant logs, image format info, or error messages are included

            We will get back to you as soon as possible. Happy coding! 🚀

          # Welcome message for first-time Pull Request contributors
          pr_message: |
            ## Congratulations on your first Pull Request! 🥳💻

            Thank you for contributing to **Img Preview**.

            **Please confirm the following:**
            - 📏 Code follows repository standards and formatting
            - ⚠️ No breaking changes to existing image preview behavior
            - ✅ Automated tests pass (`npm test`)

            Thanks for helping make this extension even better! 🌱
